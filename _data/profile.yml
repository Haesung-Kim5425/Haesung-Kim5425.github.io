bio:
  short: >-
    Haesung Kim is a postdoctoral researcher at the Specere Lab,
    Birck Nanotechnology Center, Purdue University, working on opto-electronic characterization and physics-based
    modeling of semiconductor devices. Haesung received a Ph.D. in Electrical
    Engineering from Kookmin University, Seoul, Korea, in 2025.
  long: >-
    Haesung Kim is a postdoctoral researcher at the Specere Lab,
    Birck Nanotechnology Center, Purdue University, advised by Prof. Thomas Beechem. The work centers on developing
    characterization techniques and physics-based models that extract device parameters
    which are otherwise difficult to separate — parasitic resistances, interface and
    subgap trap distributions, and the conduction band minimum — using opto-electronic
    and transient measurements. This methodology has been applied across four device
    families: silicon MOSFETs including gate-all-around and NAND flash structures,
    amorphous IGZO thin-film transistors, ferroelectric FETs, and ferroelectric TFTs.
    Haesung received the Ph.D., M.S., and B.S. degrees in Electrical Engineering from
    Kookmin University, Seoul, Korea.

research_focus: >-
  Characterization techniques and physics-based models that separate device parameters
  which conventional measurements leave entangled.

research_focus_long: >-
  The work develops characterization techniques and physics-based models that separate
  device parameters which conventional measurements leave entangled. Methods established
  in this line extract parasitic source and drain resistances independently of the
  threshold voltage, the mobility enhancement factor, interface-trap and subgap
  density-of-states distributions, and the conduction band minimum as a robust energy
  reference for amorphous oxide semiconductors. The approach rests on opto-electronic
  measurement — photonic I–V and C–V with the photovoltaic and photoconductive
  contributions de-embedded — together with transient and pulsed characterization.
  Recent work applies these methods to emerging memory devices: charge-trapping dynamics
  and read-after-write latency in HfZrOₓ ferroelectric FETs, trap dynamics resolved from
  the transient response of a-IGZO thin-film transistors, low-frequency noise as a
  function of contact metal, intrinsic field-effect mobility at cryogenic temperature,
  and proton-irradiation damage at SiNₓ and Si–SiO₂ interfaces in flash memory.
  Current work at Purdue extends this line to ferroelectric HfZrOₓ: how the crystallization
  anneal route shapes the ferroelectric response, the mechanisms behind endurance degradation
  and how that degradation varies spatially across a device population, photo-toggled
  capacitance-transient spectroscopy that resolves the subgap density of states in both space
  and energy, and the reliability of two-dimensional transistors under bias stress in an
  industrial collaboration.

