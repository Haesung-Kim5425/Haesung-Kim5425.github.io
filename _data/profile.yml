#   오너가 소속을 직접 정정했고(Specere가 정확), 그 사실만 반영한 **최소 수정**이다.
#   나머지 문장은 승인본 그대로다. 문안 재승인 대기 중이며, 그 전까지 이 버전을 쓴다
#   — 정정 전 문안을 계속 공개하는 것이 더 나쁘기 때문이다.
bio:
  short: >-
    Haesung Kim is a postdoctoral researcher at the Specere Lab,
    Birck Nanotechnology Center, Purdue University, working on opto-electronic characterization and physics-based
    modeling of semiconductor devices. Haesung received a Ph.D. in Electrical
    Engineering from Kookmin University, Seoul, Korea, in 2025.
  long: >-
    Haesung Kim is a postdoctoral researcher at the Specere Lab,
    Birck Nanotechnology Center, Purdue University, advised by Prof. Thomas Beechem. The work centers on developing
    characterization techniques and physics-based models that extract device parameters
    which are otherwise difficult to separate — parasitic resistances, interface and
    subgap trap distributions, and the conduction band minimum — using opto-electronic
    and transient measurements. This methodology has been applied across four device
    families: silicon MOSFETs including gate-all-around and NAND flash structures,
    amorphous IGZO thin-film transistors, ferroelectric FETs, and ferroelectric TFTs.
    Haesung received the Ph.D., M.S., and B.S. degrees in Electrical Engineering from
    Kookmin University, Seoul, Korea.

research_focus: >-
  Opto-electronics-based characterization of semiconductor devices, physics-based
  device modeling, and the development of parameter-extraction methods.

